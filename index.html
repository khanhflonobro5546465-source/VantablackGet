<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vantablack Hub · Premium Access</title>
<meta name="description" content="Hệ thống cấp phát Key bảo mật cao cho Vantablack Hub.">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    --bg: #f8fafc;
    --text: #0f172a;
    --text-dim: #64748b;
    --accent: #3b82f6;
    --card-bg: rgba(255, 255, 255, 0.6);
    --border: rgba(255, 255, 255, 0.8);
    
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    place-items: center;
    overflow: hidden;
    position: relative;
}

.liquid-bg { position: absolute; inset: 0; z-index: -1; overflow: hidden; filter: blur(60px); opacity: 0.6; }
.blob { position: absolute; border-radius: 50%; animation: liquid 15s infinite alternate ease-in-out; }
.blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #bfdbfe; animation-delay: 0s; }
.blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: #e0e7ff; animation-delay: -5s; }
.blob-3 { top: 40%; left: 40%; width: 40vw; height: 40vw; background: #dbeafe; animation-delay: -10s; }

@keyframes liquid {
    0% { transform: translate(0, 0) scale(1) rotate(0deg); border-radius: 40% 60% 50% 50%; }
    50% { transform: translate(10%, 15%) scale(1.1) rotate(90deg); border-radius: 50% 40% 60% 40%; }
    100% { transform: translate(-10%, -10%) scale(0.9) rotate(180deg); border-radius: 60% 50% 40% 60%; }
}

.noise { position: absolute; inset: 0; z-index: -1; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); pointer-events: none; }

.scene { perspective: 1500px; width: 100%; max-width: 480px; padding: 20px; z-index: 10; }

.card {
    --rx: 0deg; --ry: 0deg;
    position: relative;
    padding: 35px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 30px;
    box-shadow: 
        0 30px 60px -15px rgba(0, 50, 100, 0.1),
        inset 0 0 0 1px rgba(255, 255, 255, 0.9),
        inset 0 2px 20px rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(25px) saturate(150%);
    -webkit-backdrop-filter: blur(25px) saturate(150%);
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
    will-change: transform;
}

.depth-low { transform: translateZ(15px); }
.depth-mid { transform: translateZ(30px); }
.depth-high { transform: translateZ(50px); }

header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
.logo { 
    width: 45px; height: 45px; 
    background: linear-gradient(135deg, #ffffff, #e2e8f0);
    border-radius: 12px; display: grid; place-items: center;
    font-weight: 900; font-size: 22px; color: var(--accent);
    box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.2);
    border: 1px solid #fff;
}
.brand h1 { font-size: 20px; font-weight: 700; color: #1e293b; letter-spacing: -0.5px; }
.brand p { font-size: 11px; font-weight: 600; color: var(--accent); letter-spacing: 1.5px; text-transform: uppercase; }

.status-box { 
    margin-left: auto; display: flex; align-items: center; gap: 6px; 
    background: rgba(255,255,255,0.7); padding: 6px 12px; 
    border-radius: 20px; font-size: 11px; font-weight: 700; 
    border: 1px solid rgba(255,255,255,0.8);
}
.dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 10px #10b981; animation: pulse 2s infinite; }
@keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }

.label { font-size: 11px; font-weight: 700; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 8px; display: flex; justify-content: space-between;}
.key-box {
    width: 100%; padding: 20px; margin-bottom: 25px;
    background: linear-gradient(145deg, #ffffff, #f8fafc);
    border: 2px dashed #cbd5e1; border-radius: 16px;
    text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 16px; font-weight: 700; color: #1e293b;
    word-break: break-all; box-shadow: inset 0 4px 6px rgba(0,0,0,0.02);
    cursor: pointer; transition: all 0.2s;
}
.key-box:hover { border-color: var(--accent); background: #f0f9ff; }

.btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white; border: none; border-radius: 14px;
    font-size: 14px; font-weight: 700; letter-spacing: 1px;
    cursor: pointer; box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
}
.btn:hover { transform: translateY(-2px) translateZ(50px); box-shadow: 0 15px 25px -5px rgba(37, 99, 235, 0.5); }
.btn:active { transform: translateY(1px) translateZ(50px); }
</style>
</head>
<body>

<div class="liquid-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
</div>
<div class="noise"></div>

<div class="scene">
    <div class="card" id="card">
        <header class="depth-high">
            <div class="logo">V</div>
            <div class="brand">
                <p>Private Auth</p>
                <h1>Vantablack Hub</h1>
            </div>
            <div class="status-box">
                <div class="dot"></div> LIVE
            </div>
        </header>

        <div class="depth-mid">
            <div class="label">
                <span>YOUR DAILY HWID KEY</span>
                <span style="color: #10b981;">🔒 1-TO-1 LOCKED</span>
            </div>
            <div class="key-box" id="keyBox">
                Generating...
            </div>
        </div>

        <button class="btn depth-high" id="copyBtn">
            COPY ACCESS KEY
        </button>
        
        <div class="depth-low" style="text-align: center; margin-top: 20px; font-size: 11px; color: var(--text-dim); font-weight: 600;">
            Key resets every 24 hours. Applies to current HWID.<br> Do not share your key.
        </div>
    </div>
</div>

<script>
// --- ANTI DEVTOOLS ---
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('keydown', e => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
        e.preventDefault();
    }
});

setInterval(() => {
    const before = new Date().getTime();
    debugger;
    const after = new Date().getTime();
    if (after - before > 1000) {
        document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh;'>Tampering Detected. Session closed.</h1>";
    }
}, 2000);

// --- 3D TILT EFFECT ---
const scene = document.querySelector('.scene');
const card = document.getElementById('card');

scene.addEventListener('mousemove', e => {
    const rect = scene.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    const rx = (0.5 - y) * 20; 
    const ry = (x - 0.5) * 20;
    card.style.setProperty('--rx', `${rx}deg`);
    card.style.setProperty('--ry', `${ry}deg`);
});

scene.addEventListener('mouseleave', () => {
    card.style.setProperty('--rx', `0deg`);
    card.style.setProperty('--ry', `0deg`);
});

// --- THUẬT TOÁN 1 NGÀY 1 KEY (ĐỒNG BỘ VỚI LUA THEO NGÀY UTC) ---
function generateKeyFromHWID(hwid) {
    if (!hwid) return "INVALID_OR_MISSING_HWID";
    
    let realHwid = hwid;
    try { realHwid = atob(hwid); } catch(e) { realHwid = hwid; }

    // Lấy ngày hiện tại chuẩn UTC, giống hệt os.date("!%Y-%m-%d") trong Lua
    const current_date = new Date().toISOString().split('T')[0];
    const secret = realHwid + "VANTA_SYNC_2026_" + current_date;
    
    let numHash = 0;
    let hexHash = 0;
    
    for (let i = 0; i < secret.length; i++) {
        let char = secret.charCodeAt(i);
        numHash = (numHash + char * (i + 1)) % 999999;
        hexHash = (hexHash * 17 + char) % 9999999;
    }
    
    const hexStr = hexHash.toString(16).toUpperCase();
    
    const specials = ["!", "@", "#", "$", "%", "&", "*", "?", "+", "~"];
    const s1 = specials[numHash % 10];
    const s2 = String.fromCharCode(65 + (hexHash % 26)); 
    const s3 = specials[(numHash + 5) % 10];
    const s4 = String.fromCharCode(97 + (numHash % 26)); 

    return `Vantablack_${numHash}_${hexStr}_${s1}${s2}${s3}${s4}`;
}

// --- LOGIC TẠO KEY ---
const urlParams = new URLSearchParams(window.location.search);
const paramValue = urlParams.get('token') || urlParams.get('hwid');
const keyBox = document.getElementById('keyBox');
const btn = document.getElementById('copyBtn');

let finalKey = "INVALID_OR_MISSING_HWID";

if (!paramValue) {
    keyBox.innerText = "Lỗi: Không tìm thấy HWID!";
    keyBox.style.color = "#ef4444";
    btn.style.display = "none";
} else {
    // Luôn đưa lại Key cũ nếu vẫn trong cùng 1 ngày
    finalKey = generateKeyFromHWID(paramValue);
    keyBox.innerText = finalKey;
    
    // Tự động biến mất MẶT CHỮ trên web sau 10 phút (600.000 ms)
    setTimeout(() => {
        keyBox.innerText = "🔒 Key đã hết hạn hiển thị (sau 10 phút)!";
        keyBox.style.color = "#ef4444";
        keyBox.style.fontSize = "13px";
        btn.style.display = "none";
    }, 600000);
}

// Hành động Copy Key
const copyAction = async () => {
    if (finalKey === "INVALID_OR_MISSING_HWID" || btn.style.display === "none") return;
    try {
        await navigator.clipboard.writeText(finalKey);
    } catch(e) {
        const t = document.createElement('textarea');
        t.value = finalKey; document.body.appendChild(t);
        t.select(); document.execCommand('copy'); t.remove();
    }
    btn.innerText = "✓ COPIED SUCCESSFULLY";
    btn.style.background = "#10b981";
    setTimeout(() => {
        btn.innerText = "COPY ACCESS KEY";
        btn.style.background = ""; 
    }, 2000);
};

btn.onclick = copyAction;
keyBox.onclick = copyAction;
</script>
</body>
</html>
